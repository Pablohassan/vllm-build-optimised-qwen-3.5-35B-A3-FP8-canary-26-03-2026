# Recipe: Qwen3.5-35B-A3B-FP8 dual Spark main-20260326 profile (32 seqs)
# Promoted profile validated on 2x DGX Spark / GB10 / SM121.

recipe_version: "1"
name: Qwen35-35B-A3B-FP8-DualSpark-Main20260326-32Seq
description: vLLM serving Qwen3.5-35B-A3B-FP8 on 2 DGX Spark nodes with the promoted main-20260326 FP8 profile and a 32-sequence concurrency ceiling

model: Qwen/Qwen3.5-35B-A3B-FP8
container: vllm-node

mods:
  - mods/fix-qwen3-coder-next
  - mods/fix-qwen3.5-chat-template

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.33
  max_model_len: 32768
  max_num_batched_tokens: 8192
  max_num_seqs: 32

env:
  NCCL_SOCKET_IFNAME: enp1s0f1np1
  VLLM_USE_RAY_COMPILED_DAG_CHANNEL_TYPE: shm
  VLLM_TUNED_CONFIG_FOLDER: /workspace/deploy/tuned-configs
  VLLM_TEST_FORCE_FP8_MARLIN: 1
  VLLM_MARLIN_USE_ATOMIC_ADD: 0

command: |
  vllm serve Qwen/Qwen3.5-35B-A3B-FP8 \
    --host {host} \
    --port {port} \
    --served-model-name qwen35a3b-prod \
    --tensor-parallel-size {tensor_parallel} \
    --distributed-executor-backend ray \
    --language-model-only \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --scheduling-policy priority \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --generation-config vllm \
    --compilation-config '{"pass_config":{"fuse_act_quant":false}}' \
    --chat-template unsloth.jinja \
    --default-chat-template-kwargs '{"enable_thinking":false}' \
    --enable-request-id-headers \
    --trust-remote-code
